name: Auto-Import Recipe & Deploy

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Recipe URL or raw recipe text to import"
        required: true
        type: string
      notes:
        description: "Optional notes or tweaks (e.g. servings, dietary preference)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  import-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --quiet Pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CookCLI
        run: |
          COOK_VERSION="0.38.1"
          curl -sSL "https://github.com/cooklang/cookcli/releases/download/v${COOK_VERSION}/cook-x86_64-unknown-linux-gnu.tar.gz" -o cook.tar.gz
          tar -xzf cook.tar.gz
          sudo mv cook /usr/local/bin/
          rm cook.tar.gz
          cook --version

      - name: Import Recipe & Generate 16:9 Editorial Photo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECIPE_SOURCE: ${{ inputs.source }}
          RECIPE_NOTES: ${{ inputs.notes }}
        run: |
          python3 scripts/auto_import_recipe.py

      - name: Validate recipes with CookCLI Doctor
        run: |
          cook doctor

      - name: Commit & Push New Recipe to main
        run: |
          git config user.name "Bubs Recipe Bot"
          git config user.email "actions@github.com"
          git add recipes/ config/aisle.conf
          if git diff --staged --quiet; then
            echo "No new recipe changes to commit."
          else
            NEW_FILE=$(git diff --staged --name-only -- 'recipes/*/*.cook' | head -n 1)
            RECIPE_NAME=$(basename "${NEW_FILE%.cook}" | tr '-' ' ' | tr -cd 'a-zA-Z0-9 ')
            git commit -m "feat(recipes): auto-import ${RECIPE_NAME} with 16:9 editorial photo"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Build static website
        run: |
          cook build web --base-path recipes

      - name: Polish layout & configure PWA
        run: |
          python3 web/postprocess.py _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
